name: cliMEM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall -q app test

      - name: Run mock-provider schema unit tests
        run: coverage run --branch -m unittest -v test.test_mock_provider_schema test.test_mock_provider_concurrency

      - name: Run streaming chaos tests
        run: coverage run --branch -m unittest -v test.test_chaos_streaming test.test_chaos_process

      - name: Run fallback integration test
        run: python test/fallback_test.py

      - name: Run end-to-end integration test
        run: python test/e2e.py

      - name: Generate coverage report
        if: always()
        run: |
          coverage report -m | tee coverage-report.txt
          coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: |
            coverage-report.txt
            htmlcov/
